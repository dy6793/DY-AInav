server {
    listen 80;
    server_name ainav.ink www.ainav.ink;

    # 1. 静态资源缓存 (Next.js 静态文件)
    location /_next/static {
        alias /var/www/ai-nav/.next/static;
        expires 365d;
        access_log off;
    }

    # 2. 公共资源缓存 (public 文件夹)
    location /public {
        alias /var/www/ai-nav/public;
        expires 365d;
        access_log off;
    }

    # 3. 核心应用代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Gzip 压缩
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml;
}
